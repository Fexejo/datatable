# Weekly update PRs for the pinned dev tools (package.json) and the GitHub
# Actions (pinned by commit SHA). Versions must be at least two weeks old;
# commits are "chore(deps)" / "ci(deps)" (no release). @types/node stays on
# the major of the Node.js version CI runs (24, release.yml), so the type
# check doesn't accept APIs that version lacks; raise both together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tools:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
